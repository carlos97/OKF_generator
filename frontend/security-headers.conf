# Cabeceras de seguridad, incluidas explicitamente en CADA location.
#
# OJO al tocar script-src: sin 'unsafe-inline', el navegador BLOQUEA los
# manejadores de evento en linea. Angular usa uno cuando inserta el CSS critico
# en el HTML (`<link media="print" onload="this.media='all'">`), y con esa
# tecnica activa la hoja de estilos completa nunca llega a aplicarse: la
# aplicacion se ve con las reglas basicas y sin tarjetas, botones ni
# distintivos. Por eso `optimization.styles.inlineCritical` esta en false en
# angular.json. Si alguien vuelve a activarlo, hay que volver aqui.
#
# La CSP sin 'unsafe-eval' y con script-src 'self' es lo que respalda la decision
# de guardar el token en localStorage en lugar de una cookie httpOnly: junto con
# el Markdown renderizado sin HTML embebido, la superficie de XSS queda reducida
# al minimo. El compromiso esta documentado en el README.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
