# Cabeceras de seguridad, incluidas explicitamente en CADA location.
#
# La CSP sin 'unsafe-eval' y con script-src 'self' es lo que respalda la decision
# de guardar el token en localStorage en lugar de una cookie httpOnly: junto con
# el Markdown renderizado sin HTML embebido, la superficie de XSS queda reducida
# al minimo. El compromiso esta documentado en el README.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
