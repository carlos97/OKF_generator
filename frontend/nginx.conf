# ---------------------------------------------------------------------------
# nginx del contenedor `frontend`: sirve el SPA y hace de proxy inverso a la API.
#
# Al servir ambos en el MISMO ORIGEN desaparecen CORS y los preflight OPTIONS de
# la subida multipart, y el SPA puede usar rutas relativas /api sin necesidad de
# una imagen por entorno.
#
# Escucha en 8080 y no en 80 porque el proceso corre como usuario no privilegiado.
# ---------------------------------------------------------------------------

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # El tamano maximo debe acompanar a MAX_UPLOAD_BYTES del backend (20 MiB) mas
    # el sobrecoste del multipart. Si nginx corta antes, el cliente recibe un 413
    # de nginx en HTML en lugar del error JSON de la API.
    client_max_body_size 24m;

    # Las cabeceras de seguridad se centralizan en un include porque en nginx un
    # add_header dentro de un location ANULA todas las heredadas: sin volver a
    # incluirlas en cada bloque, desaparecerian silenciosamente.
    include /etc/nginx/security-headers.conf;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # --- API -----------------------------------------------------------------

    # DNS interno de Docker. Es imprescindible declararlo junto con el uso de una
    # VARIABLE en proxy_pass (ver abajo).
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    # El modificador ^~ NO es opcional.
    #
    # En nginx las localizaciones con expresion regular tienen prioridad sobre
    # las de prefijo. Sin ^~, una peticion a
    #   /api/v1/bundles/<id>/files/assets/<hash>.png
    # la captura el `location ~* \.(png|jpg|...)$` de mas abajo, nginx busca el
    # fichero en el directorio del SPA, no lo encuentra y devuelve 404 sin que la
    # peticion llegue nunca a la API. El efecto era que TODAS las imagenes de
    # assets/ salian rotas en el visor de bundles, mientras los ficheros .md
    # funcionaban con normalidad porque su extension no esta en esa lista.
    #
    # ^~ indica que si este prefijo casa, no se evaluan las regex.
    location ^~ /api/ {
        include /etc/nginx/security-headers.conf;

        # El destino va en una VARIABLE, no literal, y esto no es cosmetico.
        #
        # Con `proxy_pass http://api:8080` nginx resuelve el nombre UNA SOLA VEZ,
        # al cargar la configuracion, y cachea la IP indefinidamente. En cuanto el
        # contenedor de la API se recrea -un `docker compose up -d api`, un
        # `--scale api=3`, un reinicio- recibe una IP nueva y nginx sigue enviando
        # trafico a la vieja: toda la aplicacion responde 502 hasta que se
        # reinicia el frontend. Verificado en un despliegue real, y ademas
        # arruinaria la demostracion de "API sin estado y escalable", que es
        # justamente recrear y escalar ese servicio.
        #
        # Con una variable, nginx resuelve por peticion respetando el TTL del
        # resolver, de modo que las replicas nuevas entran en rotacion solas.
        set $api_backend "http://api:8080";
        proxy_pass $api_backend;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        # proxy_buffering OFF es imprescindible para la descarga por streaming:
        # con el valor por defecto (on) nginx acumula el ZIP completo en disco
        # antes de enviarlo, y el esfuerzo de no materializar el paquete en la API
        # queda anulado en el ultimo salto.
        proxy_buffering off;
        proxy_request_buffering off;

        # Las descargas de bundles grandes tardan: un timeout corto las cortaria
        # a mitad y el navegador recibiria un ZIP truncado.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # --- SPA -----------------------------------------------------------------
    location / {
        include /etc/nginx/security-headers.conf;
        # try_files: cualquier ruta de Angular (/jobs/abc) debe devolver
        # index.html, o al recargar la pagina el usuario veria un 404.
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:js|css|woff2?|png|jpg|jpeg|gif|svg|ico)$ {
        include /etc/nginx/security-headers.conf;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
